# Builds the ready-to-run download on GitHub's own Windows machines.
# Push a tag like v1.0.1 to publish a Release with the zip attached;
# "Run workflow" (manual) builds the same zip as a downloadable artifact without a Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build, test and publish (build.ps1)
        shell: powershell
        run: ./build.ps1

      - name: Package the zip
        shell: powershell
        run: |
          $v = '${{ github.ref_name }}'
          if (-not $v.StartsWith('v')) { $v = 'dev' }
          Copy-Item packaging\START-HERE.txt dist\START-HERE.txt
          Copy-Item LICENSE dist\LICENSE.txt
          $zip = "TOS-NEO-Companion-$v-win-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $zip | Select-Object Name, Length

      - name: Upload the zip (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TOS-NEO-Companion-dev-win-x64
          path: ${{ env.ZIP }}

      - name: Create the Release (tags)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' $env:ZIP --title 'TOS NEO Companion ${{ github.ref_name }}' --notes-file packaging\RELEASE_NOTES.md
